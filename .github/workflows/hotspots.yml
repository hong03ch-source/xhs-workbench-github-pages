name: 热点聚合（备用方案，默认不自动跑）

# 目前热点是由 Cowork 的每周定时任务生成的，不需要 API key，所以这个工作流
# 默认只能手动触发，不会每周自动跑，也就不会在 Actions 页面留下一堆空记录。
#
# 什么时候会用到它：如果哪天你不想每周手动 push，想让 GitHub 全自动跑完，
# 那就 1) 在仓库 Secrets 里加 ANTHROPIC_API_KEY 2) 把下面的 schedule 段取消注释。
# 北京时间每周一 09:00 对应 UTC 周一 01:00。
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 1 * * 1"

permissions:
  contents: write

concurrency:
  group: hotspots
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 抓取并生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HOTSPOT_MODEL: claude-sonnet-5
          HOTSPOT_COUNT: "5"
          HOTSPOT_MAX_SEARCHES: "6"
        run: node scripts/fetch-hotspots.mjs

      - name: 有变化才提交
        run: |
          if [[ -z "$(git status --porcelain data/hotspots.json)" ]]; then
            echo "没有变化，不提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hotspots.json
          git commit -m "chore: 更新本周热点聚合 ($(date -u +%Y-%m-%d))"
          git push
